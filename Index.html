<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Main Menu</title>
	<link rel="stylesheet" href="styles.css" />
</head>
<body class="index-page">
	<header class="header">
		<div class="brand"><img src = "images/gameController.png" alt="Game Controller" width="32" height="32"><span>TeamSteam</span></div>
		<button class="hamburger" aria-label="Toggle menu" aria-expanded="false" aria-controls="mainNav" id="menuBtn">☰</button>
		<nav class="nav" id="mainNav" aria-label="Main navigation">
			<a href="Index.html">Main Menu</a>
			<a href="Home.html">Home</a>
			<a href="#">About</a>
			<a href="#">Services</a>
			<a href="#">Blog</a>
			<a href="#">Contact</a>
		</nav>
	</header>
	<div class="menu-overlay" id="menuOverlay" aria-hidden="true"></div>

	<main class="main-content">
		<h1>Welcome to Game Genesis!</h1>
		<p>Use the "hamburger" on the top right to navigate through the website!</p>
	</main>

	<script>
		const btn = document.getElementById('menuBtn');
		const nav = document.getElementById('mainNav');
		const overlay = document.getElementById('menuOverlay');

		function closeMenu() {
			nav.classList.remove('show');
			overlay.classList.remove('show');
			btn.setAttribute('aria-expanded', 'false');
			document.body.classList.remove('menu-open');
		}

		function openMenu() {
			nav.classList.add('show');
			overlay.classList.add('show');
			btn.setAttribute('aria-expanded', 'true');
			document.body.classList.add('menu-open');
		}

		btn.addEventListener('click', () => {
			const isOpen = nav.classList.contains('show');
			if (isOpen) {
				closeMenu();
			} else {
				openMenu();
			}
		});

		overlay.addEventListener('click', closeMenu);
		document.addEventListener('keydown', (event) => {
			if (event.key === 'Escape') closeMenu();
		});

		nav.querySelectorAll('a').forEach((link) => {
			link.addEventListener('click', closeMenu);
		});

		window.addEventListener('resize', () => {
			if (window.innerWidth > 700) closeMenu();
		});
	</script>
</body>
</html>
