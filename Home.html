<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Game Genesis</title>
	<link rel="stylesheet" href="styles.css" />
</head>
<body>
	<main class="hero">
		<h1>Game Genesis</h1>
		<form class="prompt-bar" action="#" method="get">
			<input
				class="prompt-input"
				type="text"
				name="prompt"
				placeholder="Enter your prompt..."
				aria-label="Prompt input"
			/>
			<button class="prompt-btn" type="submit">Send</button>
		</form>
	</main>
</body>
</html>
