<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Main Menu</title>
	<style>
		:root{--bg:#ffffff;--accent:#2563eb;--text:#111827}
		*{box-sizing:border-box}
		body{font-family:Inter,Segoe UI,Helvetica,Arial,sans-serif;margin:0;background:var(--bg);color:var(--text)}
		.header{display:flex;align-items:center;justify-content:space-between;padding:.7rem 1rem;border-bottom:1px solid #e6edf6}
		.brand{display:flex;align-items:center;gap:.5rem;font-weight:700;color:var(--accent)}
		.nav{display:flex;gap:.5rem;align-items:center}
		.nav a{color:var(--text);text-decoration:none;padding:.5rem .7rem;border-radius:.5rem}
		.nav a:hover{background:#f3f6fb}
		.hamburger{display:none;border:0;background:transparent;font-size:1.4rem;cursor:pointer}
		@media (max-width:700px){
			.nav{position:absolute;top:64px;left:0;right:0;flex-direction:column;background:var(--bg);padding:1rem;border-top:1px solid #eee;display:none}
			.nav.show{display:flex}
			.hamburger{display:block}
		}
	</style>
</head>
<body>
	<header class="header">
		<div class="brand">🏠 <span>MainSite</span></div>
		<button class="hamburger" aria-label="Toggle menu" id="menuBtn">☰</button>
		<nav class="nav" id="mainNav" aria-label="Main navigation">
			<a href="#">Home</a>
			<a href="#">About</a>
			<a href="#">Services</a>
			<a href="#">Blog</a>
			<a href="#">Contact</a>
		</nav>
	</header>

	<main style="padding:1rem">
		<h1>Welcome</h1>
		<p>Use the menu above to navigate. Resize the window to see responsive behavior.</p>
	</main>

	<script>
		const btn = document.getElementById('menuBtn');
		const nav = document.getElementById('mainNav');
		btn.addEventListener('click', ()=> nav.classList.toggle('show'));
		window.addEventListener('resize', ()=> { if (window.innerWidth > 700) nav.classList.remove('show'); });
	</script>
</body>
</html>
