<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>About</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body class="index-page">
    <header class="header">
        <div class="brand"><img src="images/gameController.png" alt="Game Controller" width="32" height="32"><span>TeamSteam</span></div>
        <button class="hamburger" type="button" aria-label="Toggle menu" aria-expanded="false" aria-controls="aboutNav" id="menuBtn">☰</button>
        <nav class="nav" id="aboutNav" aria-label="About navigation" aria-hidden="true">
            <a href="Index.html">Main Menu</a>
            <a href="Home.html">Home</a>
            <a href="About.html">About</a>
            <a href="#">Services</a>
            <a href="#">Blog</a>
            <a href="#">Contact</a>
        </nav>
    </header>
    <div class="menu-overlay" id="menuOverlay" aria-hidden="true"></div>

    <main class="main-content">
        <h1>About Game Genesis</h1>
        <p>[Placeholder text: Add your about description here.]</p>
        <p>[Placeholder text: Add team mission, vision, or story here.]</p>
    </main>

    <script>
        const menuBtn = document.getElementById('menuBtn');
        const aboutNav = document.getElementById('aboutNav');
        const menuOverlay = document.getElementById('menuOverlay');
        const MOBILE_BREAKPOINT = 700;

        function setMenuState(isOpen) {
            aboutNav.classList.toggle('show', isOpen);
            menuOverlay.classList.toggle('show', isOpen);
            menuBtn.setAttribute('aria-expanded', String(isOpen));
            aboutNav.setAttribute('aria-hidden', String(!isOpen));
            menuOverlay.setAttribute('aria-hidden', String(!isOpen));
            document.body.classList.toggle('menu-open', isOpen);
        }

        function closeMenu() {
            setMenuState(false);
        }

        menuBtn.addEventListener('click', () => {
            setMenuState(!aboutNav.classList.contains('show'));
        });

        menuOverlay.addEventListener('click', closeMenu);
        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') closeMenu();
        });

        aboutNav.querySelectorAll('a').forEach((link) => {
            link.addEventListener('click', closeMenu);
        });

        window.addEventListener('resize', () => {
            if (window.innerWidth > MOBILE_BREAKPOINT) closeMenu();
        });
    </script>
</body>
</html>
